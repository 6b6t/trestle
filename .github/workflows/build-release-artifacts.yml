name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, in major.minor.patch format
        required: true
        type: string
  workflow_call:
    inputs:
      require-desktop-signing:
        description: Fail unless Windows signing and macOS signing and notarization are configured
        type: boolean
        default: false
      ref:
        description: Immutable source commit to build
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      TRESTLE_WINDOWS_CERTIFICATE_BASE64:
        required: false
      TRESTLE_WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      TRESTLE_MAC_CERTIFICATE_BASE64:
        required: false
      TRESTLE_MAC_CERTIFICATE_PASSWORD:
        required: false
      TRESTLE_MAC_SIGNING_IDENTITY:
        required: false
      TRESTLE_APPLE_ID:
        required: false
      TRESTLE_APPLE_PASSWORD:
        required: false
      TRESTLE_APPLE_TEAM_ID:
        required: false
      TRESTLE_CURSEFORGE_API_KEY:
        required: false
      TRESTLE_ANDROID_KEYSTORE_BASE64:
        required: true
      TRESTLE_ANDROID_STORE_PASSWORD:
        required: true
      TRESTLE_ANDROID_KEY_ALIAS:
        required: true
      TRESTLE_ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  signing-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require desktop signing for stable releases
        if: inputs.require-desktop-signing
        env:
          WINDOWS_CERT: ${{ secrets.TRESTLE_WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_PASSWORD: ${{ secrets.TRESTLE_WINDOWS_CERTIFICATE_PASSWORD }}
          MAC_CERT: ${{ secrets.TRESTLE_MAC_CERTIFICATE_BASE64 }}
          MAC_PASSWORD: ${{ secrets.TRESTLE_MAC_CERTIFICATE_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.TRESTLE_MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.TRESTLE_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.TRESTLE_APPLE_PASSWORD }}
          APPLE_TEAM: ${{ secrets.TRESTLE_APPLE_TEAM_ID }}
        run: |
          for key in WINDOWS_CERT WINDOWS_PASSWORD MAC_CERT MAC_PASSWORD MAC_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM; do
            if [[ -z "${!key}" ]]; then
              echo "Missing release signing configuration: $key. See docs/releases.md." >&2
              exit 1
            fi
          done

  android:
    needs: signing-preflight
    name: Build Android
    env:
      TRESTLE_CURSEFORGE_API_KEY: ${{ secrets.TRESTLE_CURSEFORGE_API_KEY }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Apply build version
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: ./scripts/set-version.sh "$TRESTLE_VERSION"

      - name: Restore Android signing key
        env:
          TRESTLE_ANDROID_KEYSTORE_BASE64: ${{ secrets.TRESTLE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TRESTLE_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "The Android release signing key is not configured." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/trestle-signing"
          printf '%s' "$TRESTLE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trestle-signing/release.p12"

      - name: Test and lint Android code
        run: ./gradlew :shared:testAndroidHostTest :androidApp:lintDebug --stacktrace

      - name: Build signed Android packages
        env:
          TRESTLE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trestle-signing/release.p12
          TRESTLE_ANDROID_STORE_PASSWORD: ${{ secrets.TRESTLE_ANDROID_STORE_PASSWORD }}
          TRESTLE_ANDROID_KEY_ALIAS: ${{ secrets.TRESTLE_ANDROID_KEY_ALIAS }}
          TRESTLE_ANDROID_KEY_PASSWORD: ${{ secrets.TRESTLE_ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          --no-configuration-cache --no-build-cache --no-daemon --stacktrace

      - name: Collect Android packages
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        shell: bash
        run: python3 scripts/collect-android-packages.py --version "$TRESTLE_VERSION"

      - name: Verify Android package signatures
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
          TRESTLE_ANDROID_STORE_PASSWORD: ${{ secrets.TRESTLE_ANDROID_STORE_PASSWORD }}
        run: |
          for arch in arm64 x64 universal; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs \
              "release-artifacts/Trestle-${TRESTLE_VERSION}-android-${arch}.apk"
          done
          jarsigner -verify -strict \
            -keystore "$RUNNER_TEMP/trestle-signing/release.p12" \
            -storetype PKCS12 -storepass:env TRESTLE_ANDROID_STORE_PASSWORD \
            "release-artifacts/Trestle-${TRESTLE_VERSION}-android-universal.aab"

      - name: Remove Android signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/trestle-signing"

      - name: Upload Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: signing-preflight
    env:
      TRESTLE_MAC_SIGNING_IDENTITY: ${{ secrets.TRESTLE_MAC_SIGNING_IDENTITY }}
      TRESTLE_CURSEFORGE_API_KEY: ${{ secrets.TRESTLE_CURSEFORGE_API_KEY }}
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            extensions: "deb rpm"
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            extensions: "deb rpm"
          - os: macos-15-intel
            platform: macos
            arch: x64
            extensions: "dmg pkg"
          - os: macos-14
            platform: macos
            arch: arm64
            extensions: "dmg pkg"
          - os: windows-2025
            platform: windows
            arch: x64
            extensions: "msi exe"
          - os: windows-11-arm
            platform: windows
            arch: arm64
            extensions: "msi exe"

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Install Linux runtime and packaging dependencies
        if: matrix.platform == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          fakeroot rpm libgl1 libegl1 libfontconfig1 libfreetype6 libasound2
          libx11-6 libxext6 libxi6 libxrender1 libxtst6

      - name: Apply build version
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        shell: bash
        run: ./scripts/set-version.sh "$TRESTLE_VERSION"

      - name: Test desktop code
        shell: bash
        run: ./gradlew :shared:desktopTest :desktopApp:test --stacktrace

      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            shared/build/test-results/desktopTest/
            desktopApp/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Linux application image
        if: matrix.platform == 'linux'
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      - name: Build Linux installers with desktop metadata
        if: matrix.platform == 'linux'
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
          TRESTLE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: >-
          python3 scripts/package-linux.py --image desktopApp/build/compose/binaries/main/app/Trestle
          --version "$TRESTLE_VERSION" --arch "$TRESTLE_ARCH"
          --output release-artifacts

      - name: Restore macOS signing identities
        if: matrix.platform == 'macos' && env.TRESTLE_MAC_SIGNING_IDENTITY != ''
        env:
          TRESTLE_MAC_CERTIFICATE_BASE64: ${{ secrets.TRESTLE_MAC_CERTIFICATE_BASE64 }}
          TRESTLE_MAC_CERTIFICATE_PASSWORD: ${{ secrets.TRESTLE_MAC_CERTIFICATE_PASSWORD }}
        run: bash scripts/prepare-macos-signing.sh

      - name: Build desktop package
        if: matrix.platform != 'linux'
        shell: bash
        run: ./gradlew :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Smoke test the packaged launcher
        env:
          TRESTLE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python3 scripts/smoke-test-package.py --root desktopApp/build/compose/binaries/main/app --platform "$TRESTLE_PLATFORM"

      - name: Verify macOS release and build versions
        if: matrix.platform == 'macos'
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          plist=desktopApp/build/compose/binaries/main/app/Trestle.app/Contents/Info.plist
          test "$(plutil -extract TrestleVersion raw "$plist")" = "$TRESTLE_VERSION"
          build_version="$(plutil -extract CFBundleVersion raw "$plist")"
          test "$build_version" -gt 0
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$build_version"

      - name: Sign and verify Windows installers
        if: matrix.platform == 'windows'
        env:
          TRESTLE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.TRESTLE_WINDOWS_CERTIFICATE_BASE64 }}
          TRESTLE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.TRESTLE_WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:TRESTLE_WINDOWS_CERTIFICATE_BASE64) { ./scripts/sign-windows.ps1 }
          else { Write-Warning 'This preview build has unsigned Windows installers.' }

      - name: Notarize and staple macOS installers
        if: matrix.platform == 'macos' && env.TRESTLE_MAC_SIGNING_IDENTITY != ''
        env:
          TRESTLE_APPLE_ID: ${{ secrets.TRESTLE_APPLE_ID }}
          TRESTLE_APPLE_PASSWORD: ${{ secrets.TRESTLE_APPLE_PASSWORD }}
          TRESTLE_APPLE_TEAM_ID: ${{ secrets.TRESTLE_APPLE_TEAM_ID }}
        run: bash scripts/notarize-macos.sh

      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          if [[ -n "${TRESTLE_MAC_KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$TRESTLE_MAC_KEYCHAIN_PATH"; fi
          rm -rf "$RUNNER_TEMP/trestle-signing"

      - name: Show packaging errors
        if: failure()
        shell: bash
        run: |
          if [[ -d desktopApp/build/compose/logs ]]; then
            find desktopApp/build/compose/logs -type f -name '*-err.txt' -exec cat {} \;
          fi

      - name: Collect desktop package
        if: matrix.platform != 'linux'
        env:
          TRESTLE_ARCH: ${{ matrix.arch }}
          TRESTLE_EXTENSIONS: ${{ matrix.extensions }}
          TRESTLE_PLATFORM: ${{ matrix.platform }}
          TRESTLE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          for extension in $TRESTLE_EXTENSIONS; do
            matches=()
            while IFS= read -r match; do
              matches+=("$match")
            done < <(find desktopApp/build/compose/binaries -type f -name "*.${extension}" | sort)

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one .${extension} package, found ${#matches[@]}." >&2
              exit 1
            fi

            cp "${matches[0]}" "release-artifacts/Trestle-${TRESTLE_VERSION}-${TRESTLE_PLATFORM}-${TRESTLE_ARCH}.${extension}"
          done

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
