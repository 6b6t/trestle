name: Set version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to set, in major.minor.patch format
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      commit-sha:
        description: Immutable source commit containing the release version
        value: ${{ jobs.set-version.outputs.commit-sha }}
      version-code:
        description: Calculated Android version code
        value: ${{ jobs.set-version.outputs.version-code }}

permissions:
  contents: write

concurrency:
  group: set-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  set-version:
    name: Set version to ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit-sha: ${{ steps.commit.outputs.sha }}
      version-code: ${{ steps.version.outputs.version-code }}

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "Run this workflow from a branch so the version commit can be pushed." >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Update Gradle version properties
        id: version
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: |
          version_code="$(./scripts/set-version.sh "$TRESTLE_VERSION")"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Commit version
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(release): bump version to ${{ inputs.version }}"
          file_pattern: gradle.properties shared/src/commonMain/kotlin/net/blockhost/trestle/app/BuildInfo.kt

      - name: Record source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
