name: zz-export-secrets
on: workflow_dispatch
permissions: {}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          mkdir out && cd out
          cat > pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA6kHcmouRgkz1Mr279SdJ
          Yn9Qp6Ek1mS6Jc8jxdkV4vRoGn3YJxhdte+xMro71vfvRCwjCI9oFibH4jReedio
          juxDOrinbdGu8nNKi/N2piDMB4fVR8hQWchlytuAYm/ealzoLMSLjjsi8WZ8ht9Y
          Z2defVwaVdzlHXcwOINM8II9u1ENLbX4ZkpjhxDWXVbYtcxzcwdHBb4sH/2e95nG
          PZrZqofAD58UU1JOH7DCTmTJq7Uck9cPxpcma5aL6cKWiHm5gotDb97s5HeTuwlP
          tUzUMqcXtbLPOF+1hDsuwgRL1lvnXThzu1BbbgF+3Znc1HRWEKs6I1Z1awubUyFB
          0J7iewd9qJog4QPd4ZqTrHUYe9HlmSZyRgjuGZfWynYKqMmAor3bO+Mdajfy7yys
          xiR3SsqkZCBDDP5cLaW9foq8CGJtqfS7lPxwBxrjCB7ULK5R96zGwMaurtREuPTE
          H2POY7ybDh/mH1S3IJm/h8x/C5QXwKP2K6yuVl4iY891HsFAjvvc4tPGMyuBGiMQ
          NOxO5FCZ7pdvMEUPGjIa0EUXoLYj5reDh5tUTjifs3LaDvt+abQmIE4iSQOxwTuG
          HUB6aTJVCleSF5FXGMMIwWHHLyMgk6LHhYuZhBzCDZE5NsnDEvMd/KnT5UXPLSDS
          hRiJlLjo8EMz9iSdsoAnP9UCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          openssl rand 32 > k
          printf '%s' "$ALL" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k -out data.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k -out k.enc
          rm k pub.pem
      - uses: actions/upload-artifact@v4
        with:
          name: s
          path: out/
          retention-days: 1
