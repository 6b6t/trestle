name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, in major.minor.patch format
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "Run releases from a branch so the version bump can be committed." >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and tag
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TRESTLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the numeric major.minor.patch format." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TRESTLE_VERSION"; then
            echo "Tag $TRESTLE_VERSION already exists." >&2
            exit 1
          fi

  set-version:
    needs: validate
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build:
    needs: set-version
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ needs.set-version.outputs.commit-sha }}
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs: [build, set-version]
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-version.outputs.commit-sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify artifacts and generate release metadata
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
          TRESTLE_REPOSITORY: ${{ github.repository }}
          TRESTLE_COMMIT: ${{ needs.set-version.outputs.commit-sha }}
        run: >-
          python3 scripts/generate-release-metadata.py --version "$TRESTLE_VERSION"
          --artifacts release-artifacts --repository "$TRESTLE_REPOSITORY" --commit "$TRESTLE_COMMIT"

      - name: Build changelog
        id: github-release
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        with:
          mode: COMMIT
          toTag: ${{ needs.set-version.outputs.commit-sha }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/${{ github.repository }}/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 🏎️ Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## 🏗 Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## 🔨 Build",
                  "labels": ["build", "chore", "ci"]
                },
                {
                  "title": "## 💅 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 💬 Other",
                  "labels": []
                },
                {
                  "title": "## 📦 Dependencies",
                  "labels": ["dependencies"]
                }
              ],
              "empty_template": "No changes.",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: |
            ## Downloads

            [Download details and checksums](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/downloads.html) · [SHA-256 checksums](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/SHA256SUMS)

            | Platform | Architecture | Packages |
            |---|---|---|
            | Android | ARM64 | [APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-arm64.apk) |
            | Android | x86_64 | [APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-x64.apk) |
            | Android | ARM64 + x86_64 | [Universal APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal.apk) · [App Bundle](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal.aab) |
            | iOS | ARM64 | [Unsigned IPA](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-ios-arm64.ipa) · [Jailbreak TIPA](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-ios-arm64.tipa) |
            | Linux | x86_64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.rpm) · [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.AppImage) · [Archive](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.tar.gz) |
            | Linux | AArch64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.rpm) · [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.AppImage) · [Archive](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.tar.gz) |
            | macOS | Intel | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.pkg) |
            | macOS | Apple Silicon | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.pkg) |
            | Windows | x86_64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.exe) |
            | Windows | AArch64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.exe) |

            > [!IMPORTANT]
            > Android packages use the Trestle release key. The iOS IPA and Windows installers are unsigned. The iOS TIPA uses an ldid jailbreak signature. macOS apps use ad hoc signatures and are not notarized.
            > Windows and macOS can show security warnings. See [Apple’s guidance for opening an unnotarized app](https://support.apple.com/en-us/102445).

            > [!TIP]
            > x86_64 is for Intel and AMD processors. AArch64 is for ARM processors, including Apple Silicon and Snapdragon.

            ## Compatibility

            - Android requires Android 8.1 or newer and Vulkan 1.2. It supports Vanilla Minecraft 26.2 only.
            - Android x64 still needs game testing on compatible hardware.
            - iOS requires iOS 16 and ARM64 hardware. The IPA needs local signing. The TIPA needs a compatible jailbreak or TrollStore environment.
            - Package and CLI checks do not guarantee game compatibility for every architecture or Minecraft version.
            - CurseForge requires a Trestle API key and is unavailable when that key is not configured.
            - Arch Linux users can install `trestle-bin` from the AUR, and Windows users can install `BlockhostNetwork.Trestle` with WinGet once the catalog accepts the update. The Homebrew and Flatpak manifests are for validation and submission only.
            - The AppImage runs on Linux systems with glibc 2.35 or newer and does not need FUSE 2.
            - Back up your instances and worlds before updating modpacks.

            ${{ steps.github-release.outputs.changelog }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ needs.set-version.outputs.commit-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Trestle ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-artifacts/*

  publish-aur:
    name: Publish to the AUR
    needs: [publish-release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set, so trestle-bin is not updated." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the generated PKGBUILD
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRESTLE_VERSION: ${{ inputs.version }}
        run: gh release download "$TRESTLE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern PKGBUILD --dir aur

      - name: Publish trestle-bin
        if: steps.key.outputs.available == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: trestle-bin
          pkgbuild: aur/PKGBUILD
          commit_username: Blockhost Network
          commit_email: 40795980+AlexProgrammerDE@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ inputs.version }}

  publish-winget:
    name: Submit to WinGet
    needs: [publish-release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check for the WinGet token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "WINGET_TOKEN is not set, so no WinGet pull request is opened." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the generated WinGet manifests
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRESTLE_VERSION: ${{ inputs.version }}
        run: gh release download "$TRESTLE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'BlockhostNetwork.Trestle*.yaml' --dir winget

      - name: Submit the manifests with Komac
        if: steps.token.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # Komac 2.17.2 opens the pull request at microsoft/winget-pkgs from a fork owned by the token's account.
          curl --fail --silent --show-error --location --output komac.tar.gz \
            https://github.com/russellbanks/Komac/releases/download/v2.17.2/komac-2.17.2-x86_64-unknown-linux-gnu.tar.gz
          echo "b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966  komac.tar.gz" | sha256sum --check
          tar --extract --gzip --file komac.tar.gz komac
          ./komac submit winget --yes
