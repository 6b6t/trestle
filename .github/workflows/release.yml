name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, in major.minor.patch format
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "Run releases from a branch so the version bump can be committed." >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and tag
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TRESTLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the numeric major.minor.patch format." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TRESTLE_VERSION"; then
            echo "Tag $TRESTLE_VERSION already exists." >&2
            exit 1
          fi

  set-version:
    needs: validate
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build:
    needs: set-version
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify release artifacts
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: |
          expected=(
            "Trestle-${TRESTLE_VERSION}-android-universal-unsigned.apk"
            "Trestle-${TRESTLE_VERSION}-android-universal-unsigned.aab"
            "Trestle-${TRESTLE_VERSION}-linux-x64.deb"
            "Trestle-${TRESTLE_VERSION}-linux-x64.rpm"
            "Trestle-${TRESTLE_VERSION}-linux-arm64.deb"
            "Trestle-${TRESTLE_VERSION}-linux-arm64.rpm"
            "Trestle-${TRESTLE_VERSION}-macos-x64.dmg"
            "Trestle-${TRESTLE_VERSION}-macos-x64.pkg"
            "Trestle-${TRESTLE_VERSION}-macos-arm64.dmg"
            "Trestle-${TRESTLE_VERSION}-macos-arm64.pkg"
            "Trestle-${TRESTLE_VERSION}-windows-x64.msi"
            "Trestle-${TRESTLE_VERSION}-windows-x64.exe"
            "Trestle-${TRESTLE_VERSION}-windows-arm64.msi"
            "Trestle-${TRESTLE_VERSION}-windows-arm64.exe"
          )

          for file in "${expected[@]}"; do
            if [[ ! -f "release-artifacts/$file" ]]; then
              echo "Missing release artifact: $file" >&2
              exit 1
            fi
          done

          artifact_count="$(find release-artifacts -maxdepth 1 -type f | wc -l)"
          if [[ "$artifact_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release artifacts, found $artifact_count." >&2
            exit 1
          fi

      - name: Build changelog
        id: github-release
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        with:
          mode: COMMIT
          toTag: ${{ github.ref }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/${{ github.repository }}/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 🏎️ Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## 🏗 Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## 🔨 Build",
                  "labels": ["build", "chore", "ci"]
                },
                {
                  "title": "## 💅 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 💬 Other",
                  "labels": []
                },
                {
                  "title": "## 📦 Dependencies",
                  "labels": ["dependencies"]
                }
              ],
              "empty_template": "No changes.",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: |
            ## Downloads

            | Platform | Architecture | Packages |
            |---|---|---|
            | Android | Universal | [APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal-unsigned.apk) · [App Bundle](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal-unsigned.aab) |
            | Linux | x86_64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.rpm) |
            | Linux | AArch64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.rpm) |
            | macOS | Intel | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.pkg) |
            | macOS | Apple Silicon | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.pkg) |
            | Windows | x86_64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.exe) |
            | Windows | AArch64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.exe) |

            > [!IMPORTANT]
            > Android, macOS, and Windows packages are unsigned. macOS packages are not notarized. Signing can be added without changing the build matrix.

            > [!TIP]
            > x86_64 is for Intel and AMD processors. AArch64 is for ARM processors, including Apple Silicon and Snapdragon.

            ${{ steps.github-release.outputs.changelog }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Trestle ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-artifacts/*
