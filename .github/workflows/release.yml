name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, in major.minor.patch format
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "Run releases from a branch so the version bump can be committed." >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate version and tag
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TRESTLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the numeric major.minor.patch format." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TRESTLE_VERSION"; then
            echo "Tag $TRESTLE_VERSION already exists." >&2
            exit 1
          fi

  set-version:
    needs: validate
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build:
    needs: set-version
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ needs.set-version.outputs.commit-sha }}
      require-desktop-signing: ${{ !inputs.prerelease }}
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs: [build, set-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.set-version.outputs.commit-sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify artifacts and generate release metadata
        env:
          TRESTLE_VERSION: ${{ inputs.version }}
          TRESTLE_REPOSITORY: ${{ github.repository }}
          TRESTLE_COMMIT: ${{ needs.set-version.outputs.commit-sha }}
        run: >-
          python3 scripts/generate-release-metadata.py --version "$TRESTLE_VERSION"
          --artifacts release-artifacts --repository "$TRESTLE_REPOSITORY" --commit "$TRESTLE_COMMIT"

      - name: Build changelog
        id: github-release
        uses: mikepenz/release-changelog-builder-action@bcae7115752d4ed746ff92feb666574428a79415 # v6.2.1
        with:
          mode: COMMIT
          toTag: ${{ needs.set-version.outputs.commit-sha }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/${{ github.repository }}/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 🏎️ Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## 🏗 Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## 🔨 Build",
                  "labels": ["build", "chore", "ci"]
                },
                {
                  "title": "## 💅 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 💬 Other",
                  "labels": []
                },
                {
                  "title": "## 📦 Dependencies",
                  "labels": ["dependencies"]
                }
              ],
              "empty_template": "No changes.",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body: |
            ## Downloads

            [Download details and checksums](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/downloads.html) · [SHA-256 checksums](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/SHA256SUMS)

            | Platform | Architecture | Packages |
            |---|---|---|
            | Android | ARM64 | [APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-arm64.apk) |
            | Android | x86_64 | [APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-x64.apk) |
            | Android | ARM64 + x86_64 | [Universal APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal.apk) · [App Bundle](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-android-universal.aab) |
            | Linux | x86_64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-x64.rpm) |
            | Linux | AArch64 | [DEB](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.deb) · [RPM](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-linux-arm64.rpm) |
            | macOS | Intel | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-x64.pkg) |
            | macOS | Apple Silicon | [DMG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.dmg) · [PKG](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-macos-arm64.pkg) |
            | Windows | x86_64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-x64.exe) |
            | Windows | AArch64 | [MSI](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.msi) · [EXE](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/Trestle-${{ inputs.version }}-windows-arm64.exe) |

            > [!IMPORTANT]
            > ${{ inputs.prerelease && 'Preview release: Android packages are signed. Desktop signing depends on configured credentials; verify OS signature prompts before installation.' || 'Android and Windows installers are signed. macOS installers are signed and notarized.' }}

            > [!TIP]
            > x86_64 is for Intel and AMD processors. AArch64 is for ARM processors, including Apple Silicon and Snapdragon.

            ${{ steps.github-release.outputs.changelog }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ needs.set-version.outputs.commit-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Trestle ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-artifacts/*
